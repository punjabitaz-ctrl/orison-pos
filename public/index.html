<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f2a42">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Orison POS">
  <title>Orison POS</title>
  <meta name="description" content="Offline-first, mobile point of sale for Orison Electronics.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app">
    <div id="screen" class="screen"></div>
    <nav id="tabbar" class="tabbar hidden" aria-label="Primary">
      <button class="tab" data-tab="dashboard" aria-label="Dashboard">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="10" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="3" width="8" height="6" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="15" width="8" height="6" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="13" y="11" width="8" height="10" rx="1.5" stroke="currentColor" stroke-width="1.6"/></svg>
        <span>Home</span>
      </button>
      <button class="tab" data-tab="register" aria-label="Register">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 9h18M8 13h4M8 16h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>Register</span>
      </button>
      <button class="tab" data-tab="inventory" aria-label="Inventory">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 7l8-4 8 4-8 4-8-4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M4 7v10l8 4 8-4V7M12 11v10" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span>Products</span>
      </button>
      <button class="tab" data-tab="history" aria-label="History">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>History</span>
      </button>
      <button class="tab" data-tab="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M19 12a7 7 0 00-.1-1.2l2-1.5-2-3.4-2.4 1a7 7 0 00-2-1.2L14 3h-4l-.4 2.7a7 7 0 00-2 1.2l-2.5-1-2 3.4 2.1 1.5a7 7 0 000 2.4L3.1 14.6l2 3.4 2.5-1a7 7 0 002 1.2L10 21h4l.4-2.7a7 7 0 002-1.2l2.5 1 2-3.4-2.1-1.5c.1-.4.2-.8.2-1.2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span>Settings</span>
      </button>
    </nav>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal"></div>
  <div id="sheet"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
